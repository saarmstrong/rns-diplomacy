[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rns-diplomacy"
version = "0.1.0"
description = "Diplomacy-style strategy game over Reticulum Network Stack"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "rns",
    "lxmf",
    "msgpack",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
rns-diplomacy-coordinator = "coordinator.server:main"
rns-diplomacy-client = "client.cli:main"

[tool.setuptools.packages.find]
include = ["protocol*", "engine*", "coordinator*", "client*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
